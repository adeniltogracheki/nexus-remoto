name: Build Nexus Remoto (Sciter, Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [master, "nexus-remoto/**"]

env:
  VCPKG_COMMIT: 120deac3062162151622ca4860575a33844ba10b
  VCPKG_DEFAULT_TRIPLET: x64-windows-static

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install LLVM/Clang (bindgen precisa de libclang)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.2"
          directory: ${{ runner.temp }}/llvm

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-libvpx-libyuv-opus-aom

      - name: Setup vcpkg + libs (libvpx, libyuv, opus, aom)
        shell: bash
        run: |
          set -e
          if [ ! -d "/c/vcpkg/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git /c/vcpkg
          fi
          cd /c/vcpkg
          git fetch --all --quiet
          git checkout ${VCPKG_COMMIT}
          ./bootstrap-vcpkg.bat -disableMetrics
          ./vcpkg install --triplet=${VCPKG_DEFAULT_TRIPLET} libvpx libyuv opus aom

      - name: Baixar Sciter.dll (Sciter e linkado dinamicamente)
        shell: bash
        run: |
          set -e
          mkdir -p sciter
          curl -sL -o sciter/sciter.dll \
            https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll
          ls -la sciter/sciter.dll

      - name: Compilar (Sciter, release)
        shell: bash
        env:
          VCPKG_ROOT: C:/vcpkg
          LIBCLANG_PATH: ${{ runner.temp }}/llvm/bin
        run: |
          set -e
          grep -F 'name = "nexusremote"'      Cargo.toml
          grep -F 'ProductName = "Nexus Remoto"' Cargo.toml
          grep -F '"Nexus Remoto".to_owned()'  libs/hbb_common/src/config.rs
          grep -F '"remoto.gmtec.tec.br"'      libs/hbb_common/src/config.rs
          grep -F 'eoR3Kpzpbn1Z8BPTnNAap2JdBzez3ybVDEtU2oizjXs=' libs/hbb_common/src/config.rs
          echo "Branding OK. Compilando..."
          cargo build --release --features inline
          ls -la target/release/nexusremote.exe

      - name: Empacotar (exe + sciter.dll)
        shell: bash
        run: |
          set -e
          mkdir -p output
          cp target/release/nexusremote.exe output/
          cp sciter/sciter.dll output/
          echo "Servidor embutido: remoto.gmtec.tec.br"                       > output/README.txt
          echo "Chave publica: eoR3Kpzpbn1Z8BPTnNAap2JdBzez3ybVDEtU2oizjXs="  >> output/README.txt
          echo "WSS via 443 (WebSocket sempre ativo)"                         >> output/README.txt
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remoto-windows-x64
          path: output/
          retention-days: 30
