name: Flutter Nightly Build

on:
  workflow_dispatch:
  push:
    branches: [master, "nexus-remoto/**"]

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      upload-artifact: true
      upload-tag: "nexus-remoto"
